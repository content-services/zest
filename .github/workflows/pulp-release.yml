# Tags and creates a GitHub release when a pulp bindings PR is merged to the default branch.
name: Tag and release pulp bindings
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "release/**"
      - ".pulp-version"

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read tag from version file
        id: version
        run: |
          if [ ! -f .pulp-version ]; then
            echo "::error::.pulp-version not found"
            exit 1
          fi
          BASE_TAG=$(tr -d '[:space:]' < .pulp-version)
          if [[ ! "$BASE_TAG" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected .pulp-version format: $BASE_TAG"
            exit 1
          fi
          # Unique tag per workflow run. Tags must stay Go-module semver
          # (release/vYEAR.MONTH.PATCH) so consumers of
          # github.com/content-services/zest/release/vYEAR can resolve them.
          # A hyphenated time suffix would be a prerelease and sort *older*
          # than the pulp-image tag, so use the run timestamp as PATCH.
          PREFIX=${BASE_TAG%.*}
          TAG_NAME="${PREFIX}.$(date +%s)"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "base_tag=$BASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG_NAME (pulp version $BASE_TAG)"

      - name: Tag and Release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          BASE_TAG: ${{ steps.version.outputs.base_tag }}
        run: |
          gh release create "$TAG_NAME" \
            --target "${{ github.sha }}" \
            --title "$TAG_NAME" \
            --notes "Pulp bindings generated from ${BASE_TAG}."
